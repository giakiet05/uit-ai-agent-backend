[project]
name = "toc-builder"
version = "0.1.0"
description = "ToC Builder for UIT AI Assistant - Build table of contents from documents for reasoning-based RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.101.0",
    "pymupdf>=1.26.4",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.1.0",
    "tiktoken>=0.11.0",
    "pyyaml>=6.0.2",
    "llama-parse>=0.5.0",
    "pydantic>=2.0.0",
]

[project.scripts]
utb = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
